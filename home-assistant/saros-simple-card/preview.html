<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saros Simple Card – preview</title>
    <style>
      :root {
        color-scheme: dark;
        --primary-color: #03a9d9;
        --primary-text-color: #eef2f4;
        --secondary-text-color: #99a2a8;
        --card-background-color: #1c1c1c;
        --ha-card-background: #1c1c1c;
        --error-color: #ef5350;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #101010;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      saros-simple-card { width: min(100%, 560px); }
      ha-card { display: block; border-radius: 18px; box-shadow: 0 4px 18px #0006; }
    </style>
  </head>
  <body>
    <saros-simple-card></saros-simple-card>
    <script src="./saros-simple-card.js"></script>
    <script>
      const card = document.querySelector("saros-simple-card");
      card.setConfig({
        entity: "vacuum.saros_20",
        cleaning_mode_entity: "select.saros_20_schoonmaakmodus",
        name: "Saros 20",
        rooms: [
          { name: "Woonkamer", area_id: "woonkamer", floor: "Begane grond" },
          { name: "Gang", area_id: "gang", floor: "Begane grond" },
          { name: "Keuken", area_id: "keuken", floor: "Begane grond" },
          { name: "Eetkamer", area_id: "eetkamer", floor: "Begane grond" },
          { name: "Badkamer", area_id: "badkamer", floor: "Eerste verdieping" },
          { name: "Overloop", area_id: "overloop", floor: "Eerste verdieping" },
          { name: "Slaapkamer", area_id: "slaapkamer", floor: "Eerste verdieping" },
          { name: "Waskamer", area_id: "waskamer", floor: "Eerste verdieping" },
          { name: "Babykamer", area_id: "babykamer", floor: "Eerste verdieping" },
        ],
      });
      card.hass = {
        states: {
          "vacuum.saros_20": { state: "cleaning", attributes: { battery_level: 87 } },
          "select.saros_20_schoonmaakmodus": {
            state: "vacuum_and_mop",
            attributes: { options: ["vacuum", "mop", "vacuum_and_mop", "vacuum_then_mop"] },
          },
        },
        callService: async () => undefined,
      };
    </script>
  </body>
</html>
