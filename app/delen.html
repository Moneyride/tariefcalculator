    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=20260718c">
    <style>
      :root {
        color: #173f36;
        background: #f7f8fa;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        text-align: center;
      }

      main {
        width: min(88vw, 28rem);
      }

      img {
        width: min(15rem, 68vw);
        height: auto;
      }

      p {
        margin: 1rem 0 0;
        color: #6b7280;
        line-height: 1.6;
      }

      a {
        color: #173f36;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="overuurtje-logo.png?v=20260718e" alt="Overuurtje.nl">
      <p data-status>De gedeelde werkdag wordt geopend...</p>
      <noscript><p>JavaScript is nodig om deze uitnodiging te openen. <a href="/">Ga naar Overuurtje.nl</a>.</p></noscript>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const invite = params.get("invite") || "";
        const sourceType = params.get("type") === "project" ? "project" : "workday";

        if (!/^[a-zA-Z0-9_-]{16,256}$/.test(invite)) {
          document.querySelector("[data-status]").innerHTML = 'Deze uitnodigingslink is niet geldig. <a href="/">Ga naar Overuurtje.nl</a>.';
          return;
        }

        const destination = new URL(sourceType === "project" ? "projects.html" : "workdays.html", location.href);
        destination.search = "";
        destination.searchParams.set("invite", invite);
        location.replace(destination.href);
      })();
    </script>
  </body>
</html>
